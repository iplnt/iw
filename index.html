  <style>
    /* Estilos para que el iframe ocupe toda la pantalla sin bordes */
    body, html { 
      margin: 0; 
      padding: 0; 
      height: 100%; 
      width: 100%; 
      overflow: hidden; /* Evita doble scroll */
      background-color: #F0F4FF; /* Color de fondo de tu app */
    }
    iframe { 
      border: none; 
      width: 100%; 
      height: 100%; 
      display: block; 
    }
  </style>
</head>
<body>

  <iframe src="https://script.google.com/macros/s/AKfycbzuTWSsyeBjwRSC9z-20PT_IID6PDqCVYu2H82RQdQrDsRpvbHhp2NerC7usyH2KP9p/exec" allowfullscreen></iframe>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(registration => {
            console.log('ServiceWorker registrado con éxito:', registration.scope);
          })
          .catch(error => {
            console.log('Error al registrar el ServiceWorker:', error);
          });
      });
    }
  </script>

</body>
